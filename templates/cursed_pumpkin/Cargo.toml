[workspace]

[package]
name = "cursed_pumpkin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Cursed Pumpkin: a private hot-potato party game on Tari Ootle"

[dependencies]
# Ootle 0.51–0.53 keep loading templates built with 0.38. Do not bump to 0.40
# unless a mainnet release says V2 templates no longer load. See MAINNET_LAUNCH.md.
tari_template_lib = "0.38"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
